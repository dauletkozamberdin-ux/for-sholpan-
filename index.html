from pathlib import Path

html = r'''<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Для Шолпан ❤️</title>
<style>
:root{
  --pink:#ff6f9f; --dark:#5a2940; --soft:#fff4f8; --accent:#ff3f7f;
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; overflow-x:hidden;
  font-family: "Trebuchet MS", Arial, sans-serif;
  background:linear-gradient(135deg,#ffe4ef,#fff8fb 50%,#ffd8e8);
  color:var(--dark); display:flex; justify-content:center; align-items:center;
}
body:before{
  content:""; position:fixed; inset:0; pointer-events:none; opacity:.25;
  background-image:radial-gradient(#fff 1px,transparent 1px);
  background-size:22px 22px;
}
.app{width:min(100%,720px); padding:22px 16px; position:relative; z-index:1}
.card{
  background:rgba(255,255,255,.9); border-radius:34px; padding:25px 20px 28px;
  box-shadow:0 20px 60px rgba(170,70,110,.18); text-align:center;
  border:2px solid rgba(255,255,255,.9); min-height:620px;
  display:flex; flex-direction:column; justify-content:center; align-items:center;
}
.cat-wrap{height:225px; display:flex; align-items:center; justify-content:center; transition:.35s}
.cat{font-size:145px; filter:drop-shadow(0 8px 6px rgba(0,0,0,.08)); animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-9px) rotate(2deg)}}
h1{font-size:clamp(26px,6vw,42px); margin:10px 0 12px; line-height:1.1}
p{font-size:19px; line-height:1.45; margin:8px auto 20px; max-width:570px}
.buttons{display:flex; gap:14px; justify-content:center; align-items:center; flex-wrap:wrap; min-height:85px}
button{
  border:0; border-radius:999px; padding:15px 26px; font-size:18px; font-weight:700;
  cursor:pointer; transition:transform .25s, box-shadow .25s, opacity .25s, font-size .25s;
  font-family:inherit;
}
button:hover{transform:translateY(-3px)}
.yes{background:linear-gradient(135deg,#ff4d88,#ff83ad); color:#fff; box-shadow:0 9px 20px #ff83ad66}
.no{background:#eee; color:#777}
.option-grid{display:grid; grid-template-columns:repeat(2,minmax(130px,1fr)); gap:12px; width:min(100%,500px)}
.option{background:#fff0f5; color:var(--dark); border:2px solid #ffd0df}
.option:hover{background:#ffdce9}
input, textarea{
  width:min(100%,540px); border:2px solid #ffd0df; border-radius:18px; padding:16px;
  font:inherit; font-size:17px; outline:none; background:#fffafd; color:var(--dark);
}
textarea{min-height:130px; resize:vertical}
.next{margin-top:16px}
.small{font-size:14px; opacity:.7}
.hidden{display:none!important}
.heart{position:fixed; font-size:22px; animation:rise 5s linear forwards; pointer-events:none; z-index:0}
@keyframes rise{from{transform:translateY(0) rotate(0);opacity:0}15%{opacity:1}to{transform:translateY(-110vh) rotate(360deg);opacity:0}}
.final-message{font-size:clamp(21px,5vw,31px); font-weight:700; line-height:1.35}
.quote{font-size:clamp(19px,4vw,27px); color:var(--accent); font-weight:800; margin-top:18px}
@media(max-width:450px){.card{min-height:650px;padding:18px 14px}.cat{font-size:120px}.cat-wrap{height:190px}.option-grid{grid-template-columns:1fr 1fr}button{font-size:16px;padding:13px 20px}}
</style>
</head>
<body>
<div class="app">
  <main class="card">
    <div class="cat-wrap"><div id="cat" class="cat">🐱</div></div>
    <div id="content"></div>
  </main>
</div>

<script>
const content = document.getElementById('content');
const cat = document.getElementById('cat');
let noClicks = 0;
let answers = {};

function hearts(count=10){
  for(let i=0;i<count;i++){
    const h=document.createElement('div'); h.className='heart';
    h.textContent=['❤️','💕','💗','💖','💘'][Math.floor(Math.random()*5)];
    h.style.left=Math.random()*100+'vw'; h.style.bottom='-30px';
    h.style.animationDelay=(Math.random()*1.5)+'s';
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),6500);
  }
}
function setCat(face){cat.textContent=face}
function show(html){content.innerHTML=html; window.scrollTo({top:0,behavior:'smooth'})}

function start(){
  setCat('🐱');
  show(`
    <h1>Шолпан, у меня к тебе один очень важный вопрос… 🥺💕</h1>
    <p>Я очень долго думал, как его задать, поэтому попросил своего самого милого помощника 🐱</p>
    <button class="yes" onclick="question()">Нажать, чтобы узнать 💌</button>
  `);
}
function question(){
  setCat('😳');
  show(`
    <h1>Шолпан… 💗</h1>
    <p>Пойдём со мной на свидание? 🥺👉👈</p>
    <div class="buttons">
      <button id="yesBtn" class="yes" onclick="chooseYes()">ДАААААААААААА ❤️</button>
      <button id="noBtn" class="no" onclick="nope()">Нет 😈</button>
    </div>
    <p class="small">Котёнок очень надеется на правильный ответ…</p>
  `);
}
function nope(){
  noClicks++;
  setCat(noClicks<2?'🥺':noClicks<4?'😭':'😼');
  const no=document.getElementById('noBtn');
  const yes=document.getElementById('yesBtn');
  if(noClicks<4){
    no.style.transform=`translate(${Math.random()*160-80}px,${Math.random()*90-45}px) scale(${Math.max(.35,1-noClicks*.16)})`;
    yes.style.transform=`scale(${1+noClicks*.18})`;
  } else {
    no.style.opacity='0'; no.style.pointerEvents='none'; no.style.width='0'; no.style.padding='0';
    yes.style.transform='scale(1.45)';
    setTimeout(()=>{no.style.display='none'},300);
  }
}
function chooseYes(){
  answers.date='Да';
  hearts(18); setCat('🥰');
  show(`
    <h1>УРАААААААААААААААААА 😭❤️</h1>
    <p>Я знал, что ты самая лучшая! Теперь выбери, куда мы пойдём 🐱🌷</p>
    <div class="option-grid">
      <button class="option" onclick="dateChoice('Кино 🎬')">Кино 🎬</button>
      <button class="option" onclick="dateChoice('Театр 🎭')">Театр 🎭</button>
      <button class="option" onclick="dateChoice('Покушать 🍜')">Покушать 🍜</button>
      <button class="option" onclick="dateChoice('Парк 🌳')">Парк 🌳</button>
      <button class="option" onclick="dateChoice('Прогулка 🌆')">Прогулка 🌆</button>
      <button class="option" onclick="dateChoice('Сюрприз 🎁')">Сюрприз 🎁</button>
    </div>
  `);
}
function dateChoice(choice){
  answers.where=choice;
  if(choice==='Покушать 🍜') food();
  else time();
}
function food(){
  setCat('😋');
  show(`
    <h1>Ммм, покушать — прекрасный выбор 😋🍽️</h1>
    <p>А какую кухню тебе хотелось бы? 🐱</p>
    <div class="option-grid">
      <button class="option" onclick="foodChoice('Азиатская 🍜')">Азиатская 🍜</button>
      <button class="option" onclick="foodChoice('Паназиатская 🍣')">Паназиатская 🍣</button>
      <button class="option" onclick="foodChoice('Европейская 🍝')">Европейская 🍝</button>
      <button class="option" onclick="foodChoice('Восточная 🥙')">Восточная 🥙</button>
      <button class="option" onclick="foodChoice('Десерты 🍰')">Десерты 🍰</button>
      <button class="option" onclick="foodChoice('Выбери сам 😌')">Выбери сам 😌</button>
    </div>
  `);
}
function foodChoice(choice){answers.food=choice; time();}
function time(){
  setCat('🤭');
  show(`
    <h1>Отлично, я всё запомнил 😌❤️</h1>
    <p>А теперь скажи, когда тебе было бы удобнее? 🐱📅</p>
    <input id="when" placeholder="Например: в субботу вечером 💕">
    <button class="yes next" onclick="saveTime()">Далее ➡️</button>
  `);
}
function saveTime(){
  answers.when=document.getElementById('when').value || 'Когда будет удобно Шолпан ❤️';
  finalWords();
}
function finalWords(){
  setCat('🥹');
  hearts(22);
  show(`
    <h1>А теперь… волшебное слово ✨</h1>
    <div class="final-message">
      Я тебя люблююююююююююю ❤️❤️❤️<br>
      щильнаааааааааа, щильнаааааааааа 🥹💕<br>
      ты у меня самая-самая лучшая,<br>
      прям любовь всей моей жизниииииииии ❤️❤️❤️❤️❤️
    </div>
    <div class="quote">«И Я ТЕБЯ СИЛЬНЕЕ И БОЛЬШЕ ЛЮБЛЮЮЮ 😈😈❤️❤️❤️❤️❤️»</div>
    <p>Теперь можешь написать мне что-нибудь 🥺👇</p>
    <textarea id="reply" placeholder="Напиши здесь всё, что хочешь сказать мне ❤️"></textarea>
    <button class="yes next" onclick="finish()">Далее 💌</button>
  `);
}
function finish(){
  answers.reply=document.getElementById('reply').value;
  setCat('💐🐱');
  hearts(30);
  show(`
    <h1>Это тебе, Шолпан 🌷❤️</h1>
    <div style="font-size:105px;margin:8px">🐱💐</div>
    <p class="final-message">Я всё организую 😌❤️<br>Тебе остаётся только быть самой красивой и прийти на наше свидание 🥰</p>
    <p>Люблю тебя очень-очень сильно ❤️❤️❤️</p>
    <button class="yes" onclick="restart()">Начать сначала 🔄</button>
  `);
}
function restart(){noClicks=0;answers={};start()}
start();
</script>
</body>
</html>
'''

path = Path("/mnt/data/sholpan_date_site.html")
path.write_text(html, encoding="utf-8")
print(path)
